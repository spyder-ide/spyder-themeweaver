[project]
authors = [
    { name = "Andrés Conrado Montoya Acosta (@conradolandia)", email = "conradolandia@ik.me" },
]
dependencies = []
name = "ThemeWeaver"
requires-python = ">= 3.12"
version = "0.5.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"src/themeweaver/resources/css" = "themeweaver/resources/css"

# Configuration for the generated spyder-themes Python package
[tool.themeweaver.spyder-package]
version = "1.0.10"
display_name = "Spyder Themes"
description = "Collection of themes for Spyder IDE"
authors = [
    { name = "Andrés Conrado Montoya Acosta (@conradolandia)", email = "conradolandia@ik.me" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: User Interfaces",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# Resolve and lock for Linux, Windows, and macOS (Intel + Apple Silicon).
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
colorspacious = ">=1.1.2,<2"
ruff = ">=0.11.13,<0.12"
pyyaml = ">=6.0.2,<7"
pytest = ">=8.4.0,<9"
pytest-cov = ">=6.0.0,<7"
pyqt = ">=5.15.11,<6"
qtpy = ">=2.4.3,<3"
qtsass = ">=0.4.0,<0.5"
randomname = ">=0.2.1,<0.3"
pyside6 = ">=6.9.1,<7"
prek = ">=0.3.8,<0.4"
lxml = ">=6.0.2,<7"

[tool.pixi.pypi-dependencies]
themeweaver = { path = ".", editable = true }
build = ">=1.2.0,<2"
twine = ">=6.0.0,<7"
qdarkstyle = { git = "https://github.com/ColinDuquesnoy/QDarkStyleSheet.git", branch = "develop" }

[tool.pixi.tasks]
lint = "ruff check . --exclude .pixi,.venv,.git,.pytest_cache,.ruff_cache,.mypy_cache,.vscode"
format = "ruff format . --exclude .pixi,.venv,.git,.pytest_cache,.ruff_cache,.mypy_cache,.vscode"
lint-fix = "ruff check --fix . --exclude .pixi,.venv,.git,.pytest_cache,.ruff_cache,.mypy_cache,.vscode"
check = { depends-on = ["lint"] }
cli = "python -m themeweaver.cli"
export-light = "python -m themeweaver.cli export --variants light --theme"
export-dark = "python -m themeweaver.cli export --variants dark --theme"
export-all = "python -m themeweaver.cli export --all"
dev-sync = "python -m themeweaver.cli dev-sync --theme"
package = "python -m themeweaver.cli python-package --run-build"
package-check = "python -m twine check dist/spyder_themes/dist/*"
publish-testpypi = "python -m twine upload --repository testpypi dist/spyder_themes/dist/*"
publish-pypi = "python -m twine upload dist/spyder_themes/dist/*"
deploy-local-all = { depends-on = [
    "export-all",
    "package",
    "package-check",
], cmd = "pip install -e dist/spyder_themes" }
list-themes = "python -m themeweaver.cli list"
theme-info = "python -m themeweaver.cli info"
generate = "python -m themeweaver.cli generate"
validate = "python -m themeweaver.cli validate"
validate-contrast = "python -m themeweaver.cli validate-contrast"
validate-contrast-all = "python -m themeweaver.cli validate-contrast --all"
interpolate = "python -m themeweaver.cli interpolate"
interpolate-lch = "python -m themeweaver.cli interpolate --method lch"
interpolate-hsv = "python -m themeweaver.cli interpolate --method hsv"
palette = "python -m themeweaver.cli palette"
gradient = "python -m themeweaver.cli gradient"
preview = "python -m scripts.theme_preview"
prek-install = "prek install --overwrite"
prek-run = "prek run --all-files"
prek-update = "prek autoupdate"
test = "pytest tests"
test-cov = "pytest tests --cov=src/themeweaver --cov-report=html --cov-report=term"
inspect-cov = "python -m http.server -b 127.0.0.1 -d ./htmlcov 8000"

[tool.pixi.tasks.export]
cmd = "python -m themeweaver.cli export --theme {{ theme }}"
args = [{ arg = "theme" }]

[tool.pixi.tasks.deploy-local]
# Export one theme, then package everything already under build/, check, and install editable.
args = [{ arg = "theme" }]
depends-on = [
    { task = "export", args = [
        "{{ theme }}",
    ] },
    { task = "package" },
    { task = "package-check" },
]
cmd = "pip install -e dist/spyder_themes"

[tool.pytest.ini_options]
pythonpath = ["tests"]
# colorspacious: docstrings with LaTeX (e.g. \\Delta) emit SyntaxWarning on Python 3.12+ until fixed upstream.
filterwarnings = ["ignore::SyntaxWarning:colorspacious\\.comparison"]

# Coverage configuration
[tool.coverage.run]
source = ["src/themeweaver"]
omit = [
    # CLI boilerplate that doesn't need testing
    "src/themeweaver/cli/__init__.py",
    "src/themeweaver/cli/__main__.py",

    # __init__.py files
    "src/themeweaver/core/__init__.py",

    # Test files themselves
    "tests/*",

    # Generated files and caches
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
    "*/htmlcov/*",
]

[tool.coverage.report]
exclude_lines = [
    # Exclude pragma comments
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Set reasonable coverage targets
fail_under = 90
show_missing = true
precision = 1
